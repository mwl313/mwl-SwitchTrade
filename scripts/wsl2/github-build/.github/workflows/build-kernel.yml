name: "Build WSL2 kernel - SwitchTrade hardware matrix"

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "WSL2-Linux-Kernel ref (tag/branch)"
        required: false
        default: "linux-msft-wsl-6.18.35.2"
      extra_kernel_config:
        description: "Optional space-separated CONFIG_FOO=y|m|n entries"
        required: false
        default: ""
      extra_firmware:
        description: "Optional space-separated relative/path=url entries"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out build recipes and patches
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc dwarves wget cpio kmod

      - name: Fetch WSL2 kernel source
        run: |
          REF="${{ inputs.kernel_ref || 'linux-msft-wsl-6.18.35.2' }}"
          git clone --depth 1 --branch "$REF" https://github.com/microsoft/WSL2-Linux-Kernel.git src

      - name: Configure (USB stack ON + WiFi modules + built-in firmware + usbip client)
        working-directory: src
        env:
          EXTRA_KERNEL_CONFIG: ${{ inputs.extra_kernel_config }}
          EXTRA_FIRMWARE_SPECS: ${{ inputs.extra_firmware }}
        run: |
          cp Microsoft/config-wsl .config
          mkdir -p firmware/rtlwifi firmware/mediatek firmware/rtw88
          LINUX_FIRMWARE_COMMIT=01205307636157a12c29e6a774bf83b218732050
          REGULATORY_COMMIT=74cb99ff3853e0092d909a8b8afeadea88dfd16b
          LINUX_FIRMWARE_BASE="https://kernel.googlesource.com/pub/scm/linux/kernel/git/firmware/linux-firmware/+/$LINUX_FIRMWARE_COMMIT"
          REGULATORY_BASE="https://kernel.googlesource.com/pub/scm/linux/kernel/git/wens/wireless-regdb/+/$REGULATORY_COMMIT"
          fetch_pinned() {
            local target=$1 url=$2 expected=$3 actual
            mkdir -p "firmware/$(dirname "$target")"
            wget -qO- "$url?format=TEXT" | base64 -d >"firmware/$target"
            test -s "firmware/$target"
            actual=$(sha256sum "firmware/$target" | awk '{print $1}')
            [[ $actual == "$expected" ]] || {
              echo "::error::firmware hash mismatch: $target"
              exit 1
            }
          }
          fetch_pinned regulatory.db "$REGULATORY_BASE/regulatory.db" \
            2fb33ca0074db573e05ef7dd50bb45b63c0ff98b7e852e1105ebad536fae8e6b
          fetch_pinned regulatory.db.p7s "$REGULATORY_BASE/regulatory.db.p7s" \
            c941c08f51c93e46722293b85631604c3740d86c3de0c75f79aef50d2e919179
          fetch_pinned rtlwifi/rtl8188eufw.bin "$LINUX_FIRMWARE_BASE/rtlwifi/rtl8188eufw.bin" \
            2ff74315287529dec2e50eb57d6e0c97d2116f28ae166773ccdf93b6360000c4
          fetch_pinned rtlwifi/rtl8192eu_nic.bin "$LINUX_FIRMWARE_BASE/rtlwifi/rtl8192eu_nic.bin" \
            b15bc955fba2fc3abc093affe62c9f7284a0b84d4f13f8ce55366488dc9aad8b
          fetch_pinned mediatek/mt7610u.bin "$LINUX_FIRMWARE_BASE/mediatek/mt7610u.bin" \
            5a4268e9021bb587426ba624b425f1e660bfc82cd63b36ad3ce6fb9ce6751760
          fetch_pinned mt7662.bin "$LINUX_FIRMWARE_BASE/mediatek/mt7662.bin" \
            f7e52492f58088cae50e51a54cca68e4abc5b74f7d0b6b731dbb4c04465a94b6
          fetch_pinned mt7662_rom_patch.bin "$LINUX_FIRMWARE_BASE/mediatek/mt7662_rom_patch.bin" \
            6f0e871268f6e4d99196d90d89bcc09fe493d010366260a2cfcaa5dd66095f8c
          fetch_pinned rt2870.bin "$LINUX_FIRMWARE_BASE/rt2870.bin" \
            251b8918391eac6415d60dca239e415aad0177e885376f2a17782e64fcbbe317
          fetch_pinned rtw88/rtw8821c_fw.bin "$LINUX_FIRMWARE_BASE/rtw88/rtw8821c_fw.bin" \
            2ef409bc418549fcf294061dd0cae1fc22fd9da79b60524950b25de18732f3f0
          FW_LIST="regulatory.db regulatory.db.p7s rtlwifi/rtl8188eufw.bin rtlwifi/rtl8192eu_nic.bin mediatek/mt7610u.bin mt7662.bin mt7662_rom_patch.bin rt2870.bin rtw88/rtw8821c_fw.bin"
          for SPEC in $EXTRA_FIRMWARE_SPECS; do
            PATH_PART="${SPEC%%=*}"
            URL_PART="${SPEC#*=}"
            [[ "$SPEC" == *=* && -n "$PATH_PART" && -n "$URL_PART" ]] || {
              echo "::error::invalid extra firmware spec: $SPEC"
              exit 1
            }
            [[ "$PATH_PART" != /* && "$PATH_PART" != *..* ]] || {
              echo "::error::unsafe extra firmware path: $PATH_PART"
              exit 1
            }
            mkdir -p "firmware/$(dirname "$PATH_PART")"
            wget -q "$URL_PART" -O "firmware/$PATH_PART"
            test -s "firmware/$PATH_PART"
            FW_LIST="$FW_LIST $PATH_PART"
          done
          # CRITICAL: config-wsl ships WITHOUT the USB stack. Every USB driver
          # (rtl8xxxu, usbip vhci_hcd) silently disappears at olddefconfig unless
          # the USB core is enabled first. Enable the whole chain explicitly.
          scripts/config \
            --enable CONFIG_USB_SUPPORT \
            --enable CONFIG_USB_COMMON \
            --enable CONFIG_USB \
            --enable CONFIG_EXTRA_FIRMWARE \
            --set-str CONFIG_EXTRA_FIRMWARE_DIR "$(pwd)/firmware" \
            --set-str CONFIG_EXTRA_FIRMWARE "$FW_LIST" \
            --module CONFIG_CFG80211 \
            --module CONFIG_MAC80211 \
            --enable CONFIG_WLAN \
            --enable CONFIG_WLAN_VENDOR_MEDIATEK \
            --enable CONFIG_WLAN_VENDOR_RALINK \
            --enable CONFIG_WLAN_VENDOR_REALTEK \
            --module CONFIG_RTL8XXXU \
            --enable CONFIG_RTL8XXXU_UNTESTED \
            --keep-case \
            --module CONFIG_MT76x0U \
            --module CONFIG_MT76x2U \
            --module CONFIG_RT2X00 \
            --module CONFIG_RT2800USB \
            --enable CONFIG_RT2800USB_RT35XX \
            --module CONFIG_RTW88 \
            --module CONFIG_RTW88_8821CU \
            --module CONFIG_TUN \
            --module CONFIG_TAP \
            --module CONFIG_CRYPTO_CCM \
            --module CONFIG_CRYPTO_CMAC \
            --module CONFIG_USBIP_CORE \
            --module CONFIG_USBIP_VHCI_HCD
          for SPEC in $EXTRA_KERNEL_CONFIG; do
            KEY="${SPEC%%=*}"
            VALUE="${SPEC#*=}"
            [[ "$KEY" =~ ^CONFIG_[A-Z0-9_]+$ ]] || {
              echo "::error::invalid config symbol: $KEY"
              exit 1
            }
            case "$VALUE" in
              y) scripts/config --enable "$KEY" ;;
              m) scripts/config --module "$KEY" ;;
              n) scripts/config --disable "$KEY" ;;
              *) echo "::error::invalid config value: $SPEC"; exit 1 ;;
            esac
          done
          make olddefconfig
          for SPEC in $EXTRA_KERNEL_CONFIG; do
            KEY="${SPEC%%=*}"
            VALUE="${SPEC#*=}"
            if [[ "$VALUE" == n ]]; then
              grep -q "^# ${KEY} is not set" .config
            else
              grep -q "^${KEY}=${VALUE}" .config
            fi || { echo "::error::olddefconfig changed $SPEC"; exit 1; }
          done

      - name: Verify required options survived olddefconfig
        working-directory: src
        run: |
          MISSING=0
          for OPT in CONFIG_USB CONFIG_USB_COMMON CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_WLAN CONFIG_WLAN_VENDOR_MEDIATEK CONFIG_WLAN_VENDOR_RALINK CONFIG_WLAN_VENDOR_REALTEK CONFIG_RTL8XXXU CONFIG_MT76x0U CONFIG_MT76x2U CONFIG_RT2X00 CONFIG_RT2800USB CONFIG_RT2800USB_RT35XX CONFIG_RTW88 CONFIG_RTW88_8821CU CONFIG_TUN CONFIG_TAP CONFIG_CRYPTO_CCM CONFIG_CRYPTO_CMAC CONFIG_USBIP_CORE CONFIG_USBIP_VHCI_HCD; do
            if ! grep -qE "^${OPT}=(y|m)" .config; then
              echo "::error::${OPT} was dropped by olddefconfig!"
              MISSING=1
            fi
          done
          grep -E "^CONFIG_(USB|USB_COMMON|CFG80211|MAC80211|WLAN|WLAN_VENDOR_MEDIATEK|WLAN_VENDOR_RALINK|WLAN_VENDOR_REALTEK|RTL8XXXU|MT76x0U|MT76x2U|RT2X00|RT2800USB|RT2800USB_RT35XX|RTW88|RTW88_8821CU|TUN|TAP|CRYPTO_CCM|CRYPTO_CMAC|USBIP_CORE|USBIP_VHCI_HCD)=" .config
          exit $MISSING

      - name: Build kernel and modules
        working-directory: src
        run: |
          KVER=$(make kernelrelease)
          echo "KVER=$KVER" >> "$GITHUB_ENV"
          make -j"$(nproc)" > build.log 2>&1 || { tail -40 build.log; exit 1; }
          rm -rf modout
          make modules_install INSTALL_MOD_PATH="$PWD/modout" INSTALL_MOD_STRIP=1

      - name: Verify built artifacts exist
        working-directory: src
        run: |
          for module in rtl8xxxu mt76x0u mt76x2u rt2800usb rtw88_8821cu vhci-hcd; do
            found=$(find modout/lib/modules -name "$module.ko*" | head -1)
            echo "$module: ${found:-MISSING}"
            [[ -n $found ]] || { echo "::error::required module missing: $module"; exit 1; }
          done

      - name: Package artifacts
        working-directory: src
        env:
          KVER: ${{ env.KVER }}
        run: |
          mkdir -p out
          cp arch/x86/boot/bzImage out/bzImage-wsl-st
          tar -C modout/lib/modules -czf "out/modules-${KVER}.tar.gz" .
          cp ../firmware-manifest.sha256 out/firmware-manifest.sha256
          sha256sum -c out/firmware-manifest.sha256
          KERNEL_SHA=$(sha256sum out/bzImage-wsl-st | awk '{print $1}')
          MODULES_SHA=$(sha256sum "out/modules-${KVER}.tar.gz" | awk '{print $1}')
          FIRMWARE_SHA=$(sha256sum out/firmware-manifest.sha256 | awk '{print $1}')
          cat > out/manifest.json <<EOF
          {
            "schema": 1,
            "kernel_release": "${KVER}",
            "kernel_sha256": "${KERNEL_SHA}",
            "modules_sha256": "${MODULES_SHA}",
            "firmware_sha256": "${FIRMWARE_SHA}",
            "primary_driver": "rtl8xxxu",
            "features": ["usbip-vhci", "tun-tap", "ccm", "cmac", "hardware-matrix-v1"],
            "experimental_vendor_8188eu": false
          }
          EOF
          {
            echo "SwitchTrade WSL2 kernel (${KVER}, production hardware matrix + USB stack + pinned firmware)"
            echo "Built by GitHub Actions."
            echo ""
            echo "Install steps:"
            echo "1. Copy bzImage-wsl-st to C:\\wsl-kernel\\"
            echo "2. Copy modules-${KVER}.tar.gz to C:\\wsl-kernel\\"
            echo "3. In WSL2 terminal:"
            echo "   sudo mkdir -p /lib/modules"
            echo "   sudo tar -xzf /mnt/c/wsl-kernel/modules-${KVER}.tar.gz -C /lib/modules"
            echo "   sudo depmod -a ${KVER}"
            echo "   sudo apt-get install -y iw tcpdump usbutils wireless-regdb hostapd"
            echo "   sudo modprobe vhci_hcd"
            echo "4. Windows PowerShell: usbipd attach --wsl --busid <BUSID>"
            echo "5. Check uname -a matches this build date (gate G1)"
          } > out/README-install.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wsl2-kernel-run${{ github.run_number }}
          path: src/out/*
          retention-days: 90
