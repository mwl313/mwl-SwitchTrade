name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            test-requirements.txt
            bridge/requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Verify .NET SDK
        shell: pwsh
        run: if ((dotnet --version) -ne '10.0.302') { throw 'Expected .NET SDK 10.0.302' }
      - name: Install locked test dependencies
        run: python -m pip install --disable-pip-version-check --requirement test-requirements.txt
      - name: Full pytest, including package manifest and integrity checks
        run: python -m pytest
      - name: Build desktop
        run: dotnet build apps/desktop/SwitchTrade.Desktop/SwitchTrade.Desktop.csproj --configuration Release
      - name: Run desktop self-test
        run: dotnet run --no-build --configuration Release --project apps/desktop/SwitchTrade.Desktop/SwitchTrade.Desktop.csproj -- --self-test
      - name: Build replacement prerequisite and provisioner
        run: |
          dotnet build installer/replacement/SwitchTrade.Prerequisites/SwitchTrade.Prerequisites.csproj --configuration Release
          dotnet build installer/replacement/SwitchTrade.Provisioner/SwitchTrade.Provisioner.csproj --configuration Release
      - name: Run replacement provisioner contract and fault-injection tests
        run: dotnet run --configuration Release --project installer/replacement/SwitchTrade.Provisioner.Tests/SwitchTrade.Provisioner.Tests.csproj
      - name: Build setup
        run: dotnet build installer/bootstrap/SwitchTrade.Setup.csproj --configuration Release
      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($_.FullName): $($errors -join '; ')" }
          }
      - name: Parse PowerShell with PowerShell 7
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$($_.FullName): $($errors -join '; ')" }
          }
      - name: Run PowerShell 7 kernel lifecycle simulation
        shell: pwsh
        run: ./installer/Test-KernelLifecycle.ps1 -TestRoot "$env:RUNNER_TEMP/kernel-lifecycle-pwsh"
      - name: Run Windows PowerShell 5.1 setup lifecycle simulation
        shell: powershell
        run: ./installer/Test-SetupLifecycle.ps1 -TestRoot "$env:RUNNER_TEMP/setup-lifecycle-ps5"
      - name: Run PowerShell 7 setup lifecycle simulation
        shell: pwsh
        run: ./installer/Test-SetupLifecycle.ps1 -TestRoot "$env:RUNNER_TEMP/setup-lifecycle-pwsh"
      - name: Reject vulnerable .NET dependency graphs
        shell: pwsh
        run: |
          foreach ($project in @(
            'apps/desktop/SwitchTrade.Desktop/SwitchTrade.Desktop.csproj',
            'installer/bootstrap/SwitchTrade.Setup.csproj',
            'installer/replacement/SwitchTrade.Prerequisites/SwitchTrade.Prerequisites.csproj',
            'installer/replacement/SwitchTrade.Provisioner/SwitchTrade.Provisioner.csproj',
            'installer/replacement/SwitchTrade.Provisioner.Tests/SwitchTrade.Provisioner.Tests.csproj',
            'installer/replacement/wix/Desktop/SwitchTrade.Desktop.wixproj',
            'installer/replacement/wix/Bundle/SwitchTrade.Bundle.wixproj'
          )) {
            $report = dotnet list $project package --vulnerable --include-transitive 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw $report }
            if ($report -match 'has the following vulnerable packages') { throw $report }
          }

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            test-requirements.txt
            bridge/requirements.txt
      - name: Install locked test dependencies
        run: python -m pip install --disable-pip-version-check --requirement test-requirements.txt
      - name: Full pytest
        run: python -m pytest
      - name: Check shell syntax
        run: |
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git ls-files '*.sh')
      - name: Run ShellCheck
        run: shellcheck $(git ls-files '*.sh')
      - name: Simulate cold radio, RX recovery, PHY handoff, and lock lifecycle
        run: bash scripts/tests/test-radio-workflow.sh
      - name: Install dependency auditor
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - name: Audit locked Python dependencies with reviewed exceptions
        run: python scripts/run-pip-audit.py
