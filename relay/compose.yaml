services:
  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
      args:
        SWITCHTRADE_RELAY_REVISION: ${SWITCHTRADE_RELAY_REVISION:?Set the exact clean checkout SHA}
    image: switchtrade-core-relay:${SWITCHTRADE_RELAY_REVISION:?Set the exact clean checkout SHA}
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      # The immediate TLS ingress address as seen INSIDE this container, never '*'.
      FORWARDED_ALLOW_IPS: ${SWITCHTRADE_RELAY_TRUSTED_PROXIES:?Set the exact trusted ingress IP}
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:8788:8788"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8788/core/health',timeout=2));
          assert data['status']=='ok' and data['service']=='switchtrade-core-relay'
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 10s
    stop_grace_period: 20s
